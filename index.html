<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D173B">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="ikon-buku-192.png">
<link rel="apple-touch-icon" href="ikon-buku-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bahasa Arab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bahasa Arab</title>
<style>
  :root {
    --navy: #0D173B;
    --navy-dark: #1A202C;
    --teal: #4AB7E0;
    --coral: #ED8936;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--navy); }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%) fixed;
  }
  .btn {
    display: inline-block; padding: .85rem 2rem; border-radius: 8px;
    font: 600 1.15rem/1.4 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    background: var(--coral); color: var(--navy-dark); text-decoration: none;
  }
  .btn:hover { filter: brightness(1.08); }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
</style>
</head>
<body>
  <a class="btn" href="bahasa-arab/">Bahasa Arab</a>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
