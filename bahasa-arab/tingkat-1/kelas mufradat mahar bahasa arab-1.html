<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelas Mufradat Mahar Bahasa Arab 1</title>
<style>
  :root {
    --navy: #0D173B;
    --navy-dark: #1A202C;
    --navy-panel: #142050;
    --teal: #4AB7E0;
    --coral: #ED8936;
    --line: rgba(74, 183, 224, .28);
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--navy); }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%) fixed;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  .wrap { width: min(1120px, 100% - 2rem); margin-inline: auto; padding-block: 1.25rem; }
  .panel {
    background: var(--navy-panel);
    border: 1px solid var(--line);
    border-top: 3px solid var(--teal);
    border-radius: 8px;
    min-height: calc(100vh - 2.5rem);
    padding: 1rem;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .back {
    display: inline-block; padding: .6rem 1.1rem; border-radius: 8px;
    font: 700 1.05rem/1.4 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--teal); background: var(--navy);
    border: 1px solid var(--teal); text-decoration: none; cursor: pointer;
  }
  .back:hover { background: rgba(74, 183, 224, .14); }
  .list {
    display: flex; flex-direction: column; align-items: center;
    gap: 1rem; margin-top: 1rem;
  }
  .btn {
    display: block; width: min(100%, 15rem); text-align: center;
    padding: .9rem 1.25rem; border-radius: 6px; cursor: pointer;
    font: 700 1.1rem/1.4 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    background: var(--coral); color: var(--navy-dark); text-decoration: none;
  }
  .btn:hover { filter: brightness(1.08); }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

  /* Pengganti halaman: tanpa JavaScript dan tanpa pindah alamat */
  .sw { position: absolute; opacity: 0; pointer-events: none; }
  #p1 { display: none; }
  #v-p1:checked ~ .wrap #p1 { display: block; }
  #v-p1:checked ~ .wrap #daftar { display: none; }
</style>
</head>
<body>

<input class="sw" type="radio" name="halaman" id="v-daftar" checked tabindex="-1">
<input class="sw" type="radio" name="halaman" id="v-p1" tabindex="-1">

<main class="wrap">

  <!-- Panel daftar pertemuan -->
  <section class="panel" id="daftar">
    <div class="top">
      <a class="back" href="index.html">Kembali</a>
    </div>
    <div class="list">
      <label class="btn" for="v-p1" role="button" tabindex="0">Pertemuan ke 1</label>
    </div>
  </section>

  <!-- Panel kosong Pertemuan ke 1 -->
  <section class="panel" id="p1">
    <div class="top">
      <label class="back" for="v-daftar" role="button" tabindex="0">Kembali</label>
    </div>
  </section>

</main>

<script>
  // Tambahan: tombol bisa ditekan dengan keyboard (Enter / Spasi)
  document.querySelectorAll('label[role="button"]').forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    });
  });
</script>
</body>
</html>
