<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  :root {
    --navy: #0D173B;
    --navy-dark: #1A202C;
    --navy-panel: #142050;
    --teal: #4AB7E0;
    --coral: #ED8936;
    --line: rgba(74, 183, 224, .28);
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--navy); }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%) fixed;
  }
  .wrap { width: min(1120px, 100% - 2rem); margin-inline: auto; padding-block: 1.25rem; display: grid; gap: 1.25rem; }
  .panel {
    background: var(--navy-panel);
    border: 1px solid var(--line);
    border-top: 3px solid var(--teal);
    border-radius: 8px;
    min-height: 160px;
  }
  .panel-menu { min-height: 72px; padding: 1rem; display: flex; align-items: center; justify-content: center; }
  [hidden] { display: none !important; }
  .panel-isi { min-height: calc(100vh - 2.5rem); padding: 1rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .panel-isi .btn-kembali { align-self: flex-start; }
  .btn-kembali {
    display: inline-block; padding: .5rem 1rem; border-radius: 6px; cursor: pointer;
    background: none; border: 1px solid var(--teal); color: var(--teal); text-decoration: none;
    font: 600 .95rem/1.4 "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  .btn-kembali:hover { background: rgba(74, 183, 224, .12); }
  .btn {
    display: inline-block; padding: .65rem 1.25rem; border-radius: 6px;
    font: 600 1rem/1.4 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    background: var(--coral); color: var(--navy-dark); text-decoration: none;
    border: 0; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

</style>
</head>
<body>
<main class="wrap">
  <section class="panel panel-menu">
    <button type="button" class="btn" id="buka">Tingkat 1</button>
  </section>
  <section class="panel panel-isi" id="tingkat-1" hidden>
    <button type="button" class="btn-kembali" id="kembali">Kembali</button>
    <a class="btn" href="mufradat-1.html">Mufradat</a>
  </section>
</main>
<script>
  var menu = document.querySelector('.panel-menu');
  var isi = document.getElementById('tingkat-1');
  document.getElementById('buka').addEventListener('click', function () {
    menu.hidden = true; isi.hidden = false; window.scrollTo(0, 0);
  });
  document.getElementById('kembali').addEventListener('click', function () {
    isi.hidden = true; menu.hidden = false; window.scrollTo(0, 0);
  });
</script>
</body>
</html>
